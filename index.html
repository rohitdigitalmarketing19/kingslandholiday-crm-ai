<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kingsland Holidays AI CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* PRINT OVERRIDES: Ensure PDF & Browser Print output is crisp, visible & non-blank */
      @media print {
        html, body, #root {
          width: 100% !important;
          height: auto !important;
          min-height: 100% !important;
          overflow: visible !important;
          position: static !important;
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          transform: none !important;
          filter: none !important;
          backdrop-filter: none !important;
        }

        .print\:hidden,
        nav,
        header,
        sidebar,
        button {
          display: none !important;
        }

        .fixed.inset-0 {
          position: static !important;
          background: transparent !important;
          backdrop-filter: none !important;
          overflow: visible !important;
          width: 100% !important;
          height: auto !important;
          display: block !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        .fixed.inset-0 > div {
          max-height: none !important;
          max-width: 100% !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          background: #ffffff !important;
          position: static !important;
        }

        .printable-voucher-container {
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 auto !important;
          padding: 0 !important;
          background: #ffffff !important;
          box-shadow: none !important;
          border: none !important;
          display: block !important;
          visibility: visible !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
